name: Daily Harvest Vault

on:
  schedule:
    - cron: '25 3 * * 1-5'   # Session 1: 08:55 AM IST (Exits cleanly at 02:40 PM IST)
    - cron: '16 9 * * 1-5'   # Session 2: 02:46 PM IST (Exits cleanly at 08:31 PM IST)
    - cron: '08 15 * * 1-5'  # Session 3: 08:38 PM IST (Runs till 11:35 PM IST + Nightly Forensics)
  workflow_dispatch:

concurrency:
  group: v3-trading-engine-singleton
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - name: Check Market Hours Gate (Block 23:36 - 08:30 IST Sleep Window)
        id: time_gate
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          hhmm = ist.strftime('%H:%M')
          is_sleep = (hhmm >= '23:36' or hhmm < '08:30')
          print(f'Current IST: {hhmm} | Sleep Guard Active: {is_sleep}')
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'allow_run={str(not is_sleep).lower()}\n')
          "

      - name: Checkout Code
        if: steps.time_gate.outputs.allow_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.time_gate.outputs.allow_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.time_gate.outputs.allow_run == 'true'
        run: |
          pip install requests pandas numpy pytz urllib3 pyotp playwright openpyxl matplotlib upstox-python-sdk
          playwright install --with-deps chromium

      - name: Auto-Generate Fresh Upstox Token (Market Hours Only)
        if: steps.time_gate.outputs.allow_run == 'true'
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_KEY: ${{ secrets.UPSTOX_TOTP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u get_token_auto.py
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            TOKEN_VAL=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            echo "UPSTOX_ACCESS_TOKEN=$TOKEN_VAL" >> $GITHUB_ENV
          fi

      - name: Send 08:55 AM Institutional Quant Homework Briefing
        if: steps.time_gate.outputs.allow_run == 'true'
        continue-on-error: true
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN || secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            FILE_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            if [ -n "$FILE_TOKEN" ]; then
              export UPSTOX_ACCESS_TOKEN="$FILE_TOKEN"
            fi
          fi
          python -u -c "
          from datetime import datetime, timezone, timedelta
          import live_engine, ai_trading_agent
          live_engine.restore_journal_from_google_sheet()
          ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          if '08:35' <= ist.strftime('%H:%M') <= '09:15':
              agent = ai_trading_agent.TickByTickAITradingAgent()
              agent.generate_institutional_homework_briefing(send_morning_msg=True)
          "

      - name: Run Self-Maturing V3 Live Engine (with Tick-by-Tick AI Trading Agent)
        if: steps.time_gate.outputs.allow_run == 'true'
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN || secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPITAL_PER_TRADE: ${{ secrets.CAPITAL_PER_TRADE }}
          MCX_CAPITAL_PER_TRADE: ${{ secrets.MCX_CAPITAL_PER_TRADE }}
          PAPER_MODE: ${{ secrets.PAPER_MODE || 'true' }}
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            FILE_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            if [ -n "$FILE_TOKEN" ]; then
              export UPSTOX_ACCESS_TOKEN="$FILE_TOKEN"
            fi
          fi
          python -u live_engine.py

      - name: Run Nightly Vault Harvester, Brain Calibration & Journal Report (23:25-23:55 IST Only)
        if: always() && steps.time_gate.outputs.allow_run == 'true'
        continue-on-error: true
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN || secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPITAL_PER_TRADE: ${{ secrets.CAPITAL_PER_TRADE }}
          MCX_CAPITAL_PER_TRADE: ${{ secrets.MCX_CAPITAL_PER_TRADE }}
          VAULT_DB_PATH: live_journal/nifty_vault.db
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            FILE_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            if [ -n "$FILE_TOKEN" ]; then
              export UPSTOX_ACCESS_TOKEN="$FILE_TOKEN"
            fi
          fi
          python -u -c "
          import os, json, subprocess
          from datetime import datetime, timezone, timedelta
          import live_engine
          live_engine.restore_journal_from_google_sheet()
          ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          hhmm = ist.strftime('%H:%M')
          if '23:25' <= hhmm <= '23:55':
              if os.path.isfile('harvester.py'):
                  subprocess.run(['python', '-u', 'harvester.py'], check=False)
              if os.path.isfile('auto_tuner.py'):
                  import auto_tuner
                  vix_chg = float(json.load(open('live_journal/macro_context.json')).get('vix_chg_pct', 0.0)) if os.path.isfile('live_journal/macro_context.json') else 0.0
                  exp_str = str(json.load(open('live_journal/strategy_params.json')).get('nearest_option_expiry', '')) if os.path.isfile('live_journal/strategy_params.json') else ''
                  auto_tuner.run_nightly_calibration(nearest_option_expiry_str=exp_str, vix_change_pct=vix_chg)
              if os.path.isfile('ai_trading_agent.py'):
                  subprocess.run(['python', '-u', 'ai_trading_agent.py'], check=False)
              if os.path.isfile('generate_journal_analytics.py'):
                  subprocess.run(['python', '-u', 'generate_journal_analytics.py'], check=False)
          else:
              print(f'Skipping EOD report at {hhmm} IST (only runs between 23:25 and 23:55 IST).')
          "

      - name: Upload Live Trade Journal & Memory Artifact
        if: always() && steps.time_gate.outputs.allow_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-trades-journal
          path: live_journal/

      - name: Commit & Push Journal, Vault, AI Code Upgrades & Self-Tuned Params
        if: always() && steps.time_gate.outputs.allow_run == 'true'
        run: |
          git config --global user.name "AI_TRADING_AGENT"
          git config --global user.email "bot@nifty-harvest.local"
          git add live_journal/* *.py || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "AI_TRADING_AGENT: update journal, vault, driver gear & self-upgraded code [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master
            git push
            echo "Journal, Vault, Macro Context, Driver Gear & AI Code Upgrades committed."
          fi
