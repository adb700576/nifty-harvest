name: Daily Harvest Vault

on:
  schedule:
    - cron: '15 3 * * 1-5'  # Somvar te Shukravar 03:15 UTC (8:45 AM IST)
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz urllib3 pyotp playwright openpyxl matplotlib
          playwright install --with-deps chromium

      - name: Auto-Generate Fresh Upstox Token
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_KEY: ${{ secrets.UPSTOX_TOTP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u get_token_auto.py
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            TOKEN_VAL=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            echo "UPSTOX_ACCESS_TOKEN=$TOKEN_VAL" >> $GITHUB_ENV
            echo "✅ Auto-generated Token written to GITHUB_ENV"
          else
            echo "[-] ACCESS_TOKEN.txt empty or missing, fallback to Secrets"
          fi

      - name: Run Harvester
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            export UPSTOX_ACCESS_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
          fi
          python -u harvester.py

      - name: Inspect Vault Data
        run: |
          python -u -c "
          import sqlite3, pandas as pd
          conn = sqlite3.connect('nifty_vault.db')
          cur = conn.cursor()
          cur.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name='nifty_options_1m'\")
          if cur.fetchone():
              print('\n========== स्ट्राइकनिहाय सारांश ==========')
              df_sum = pd.read_sql_query('SELECT symbol, option_type, strike, COUNT(*) as candles, MIN(open) as min_p, MAX(close) as max_p, AVG(iv) as avg_iv, AVG(delta) as avg_delta FROM nifty_options_1m GROUP BY symbol', conn)
              print(df_sum.to_string(index=False))
          else:
              print('[!] टेबल nifty_options_1m अद्याप तयार झालेले नाही.')
          conn.close()
          "

      - name: Upload Harvested DB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvested-nifty-vault
          path: nifty_vault.db

      - name: Run Live Paper Trader Engine
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            FILE_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            if [ -n "$FILE_TOKEN" ]; then
              export UPSTOX_ACCESS_TOKEN="$FILE_TOKEN"
            fi
          fi

          echo "Token ready for Live Engine. Length: ${#UPSTOX_ACCESS_TOKEN}"

          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "❌ Error: Token sapadla nahi!"
            exit 1
          fi

          python -u live_engine.py

      - name: Upload Live Trade Journal Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-trades-journal
          path: live_journal/

      - name: Generate Master Journal & Analytics
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_journal_analytics.py

      - name: Commit & Push Journal Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_journal/*.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(journal): auto-update trade logs [skip ci]" && git push)
