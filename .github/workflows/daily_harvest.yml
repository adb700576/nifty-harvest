name: Daily Nifty Data Harvest & Auto PnL Engine

on:
  schedule:
    # दररोज दुपारी ०३:३६ वाजता (10:06 AM UTC)
    - cron: '6 10 * * 1-5'
  workflow_dispatch: # मॅन्युअली चाचणी घेण्यासाठी

jobs:
  harvest-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Harvester & Strategy Engine
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python harvester.py

      - name: Upload Vault DB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-vault-db
          path: nifty_vault.db
