name: Daily Harvest Vault

on:
  schedule:
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz urllib3 pyotp playwright
          playwright install --with-deps chromium

      - name: Auto-Generate Fresh Upstox Token
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_KEY: ${{ secrets.UPSTOX_TOTP_KEY }}
        run: python -u get_token_auto.py

      - name: Run Harvester
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u harvester.py

      - name: Inspect Vault Data
        run: |
          python -u -c "
          import os, sqlite3, pandas as pd
          if not os.path.exists('nifty_vault.db'):
              print('[-] nifty_vault.db फाईल सापडली नाही.')
              exit(1)

          conn = sqlite3.connect('nifty_vault.db')
          cursor = conn.cursor()
          cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name='nifty_options_1m'\")
          if cursor.fetchone():
              print('\n========== स्ट्राइकनिहाय सारांश ==========\n')
              df_sum = pd.read_sql_query('SELECT symbol, option_type, strike, COUNT(*) as candles, MIN(open) as min_p, MAX(high) as max_p, AVG(iv) as avg_iv, AVG(delta) as avg_delta FROM nifty_options_1m GROUP BY symbol ORDER BY strike, option_type', conn)
              print(df_sum.to_string(index=False))
          else:
              print('[!] टेबल nifty_options_1m अद्याप तयार झालेले नाही.')
          conn.close()
          "

      - name: Run Signal Test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u test_yesterday_signals.py

      - name: Upload Harvested DB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvested-nifty-vault
          path: nifty_vault.db
      - name: Run Live Paper Trader Engine
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u live_engine.py

      - name: Upload Live Trade Journal Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-trades-journal
          path: live_journal/
