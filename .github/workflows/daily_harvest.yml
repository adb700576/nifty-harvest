name: Daily Harvest Vault

on:
  schedule:
    # दर सोमवार ते शुक्रवार सकाळी 8:45 AM IST (UTC 3:15 AM)
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz urllib3 pyotp playwright
          playwright install --with-deps chromium

      - name: Auto-Generate Fresh Upstox Token
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_KEY: ${{ secrets.UPSTOX_TOTP_KEY }}
        run: python -u get_token_auto.py

      - name: Run Harvester
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u harvester.py

        - name: Inspect Vault Data
        run: python -u view_vault_data.py

      - name: Upload Harvested DB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvested-nifty-vault
          path: nifty_vault.db
