name: Daily Harvest Vault

on:
  schedule:
    - cron: '25 3 * * 1-5'   # Session 1: 08:55 AM IST (Zero-Gap overlap till 02:46 PM IST)
    - cron: '16 9 * * 1-5'   # Session 2: 02:46 PM IST (Zero-Gap overlap till 08:38 PM IST)
    - cron: '08 15 * * 1-5'  # Session 3: 08:38 PM IST (Runs till 11:20 PM IST + Nightly Forensics)
  workflow_dispatch:

concurrency:
  group: v3-trading-engine-singleton
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz urllib3 pyotp playwright openpyxl matplotlib upstox-python-sdk
          playwright install --with-deps chromium

      - name: Auto-Generate Fresh Upstox Token
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_KEY: ${{ secrets.UPSTOX_TOTP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u get_token_auto.py
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            TOKEN_VAL=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            echo "UPSTOX_ACCESS_TOKEN=$TOKEN_VAL" >> $GITHUB_ENV
          fi

      - name: Run Self-Maturing V3 Live Engine (with Pre-Market Macro Radar)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN || secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            FILE_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            if [ -n "$FILE_TOKEN" ]; then
              export UPSTOX_ACCESS_TOKEN="$FILE_TOKEN"
            fi
          fi
          python -u live_engine.py

      - name: Run Nightly Deep Forensics & Driver Skill Coach
        if: always()
        continue-on-error: true
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN || secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
        run: |
          if [ -f ACCESS_TOKEN.txt ] && [ -s ACCESS_TOKEN.txt ]; then
            FILE_TOKEN=$(cat ACCESS_TOKEN.txt | tr -d '\r\n ')
            if [ -n "$FILE_TOKEN" ]; then
              export UPSTOX_ACCESS_TOKEN="$FILE_TOKEN"
            fi
          fi
          if [ -f auto_tuner.py ]; then
            python -u auto_tuner.py
          fi

      - name: Upload Live Trade Journal & Memory Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-trades-journal
          path: live_journal/

      - name: Commit & Push Journal, Macro Context & Self-Tuned Params
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "live_journal" ] && [ -n "$(ls -A live_journal/ 2>/dev/null)" ]; then
            git add live_journal/*
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "chore(ai-coach): update trade journal, macro radar, memory & driver gear [skip ci]"
              git pull --rebase origin main || git pull --rebase origin master
              git push
              echo "✅ Journal, Macro Context, Memory & Driver Gear committed."
            fi
          fi
