name: Daily Harvest Vault

on:
  schedule:
    # दररोज दुपारी 3:35 IST (UTC 10:05 AM) मार्केट बंद झाल्यानंतर डेटा साठवण्यासाठी
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz urllib3

      - name: Run Harvester
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
        run: |
          python -u harvester.py

      - name: Upload Harvested DB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvested-nifty-vault
          path: nifty_vault.db
