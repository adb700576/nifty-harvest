name: V3 Quant Trading Engine

on:
  workflow_dispatch: # Manual run button only when you want it
  schedule:
    # 08:45 AM IST (03:15 UTC) - Morning Session Start (Mon-Fri)
    - cron: '15 3 * * 1-5'
    # 02:45 PM IST (09:15 UTC) - Afternoon Handover (Mon-Fri)
    - cron: '15 9 * * 1-5'
    # 08:45 PM IST (15:15 UTC) - Evening MCX Handover (Mon-Fri)
    - cron: '15 15 * * 1-5'

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Upstox Token (Daytime Market Hours Only)
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE: ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
        run: |
          python auto_login.py

      - name: Run V3 Live Engine
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          PAPER_MODE: ${{ secrets.PAPER_MODE }}
          CAPITAL_PER_TRADE: ${{ secrets.CAPITAL_PER_TRADE }}
          MCX_CAPITAL_PER_TRADE: ${{ secrets.MCX_CAPITAL_PER_TRADE }}
        run: |
          python live_engine.py

      - name: Run Auto Tuner & Journal Sync (Only After 23:30 IST EOD)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          ist = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          if '23:30' <= ist.strftime('%H:%M') <= '23:55':
              import subprocess
              subprocess.run(['python', 'auto_tuner.py'], check=False)
          else:
              print('Skipping EOD report outside 23:30-23:55 IST window.')
          "

      - name: Commit updated journal & brain state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_journal/ || true
          git diff --staged --quiet || git commit -m "Auto-sync journal & brain state"
          git push || true
