name: Run Gann Square Backtest

on:
  workflow_dispatch:

jobs:
  backtest-gann:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz urllib3

      - name: Run Gann Engine
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
        run: |
          python -u oct_gann_backtest.py
